{% load wishlist_tags %}{% wishlist_css %}{% wishlist_js %}
{% if is_authenticated %}
<button type="button" class="wish-btn{% if in_wishlist %} is-active{% endif %}"
        data-wishlist-toggle data-product-id="{{ product.pk }}"
        data-url="{% url 'product_catalog:toggle_wishlist' product.pk %}"
        aria-pressed="{{ in_wishlist|yesno:'true,false' }}"
        aria-label="{% if in_wishlist %}Hapus dari wishlist{% else %}Simpan ke wishlist{% endif %}">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
  <span class="wish-label">Wishlist</span>
</button>
{% else %}
<a class="wish-btn" href="{% url 'akun:login' %}?next={{ request.get_full_path|urlencode }}"
   aria-label="Masuk untuk menyimpan ke wishlist">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
  <span class="wish-label">Wishlist</span>
</a>
{% endif %}
